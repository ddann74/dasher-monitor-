name: Android Build

# Compile-check only -- this catches real build errors (the thing the
# sandboxed dev environment this project is often edited in cannot do:
# no Android SDK is reachable from there, see docs/*/PROGRESS.md entries
# for the details). It does NOT replace on-device/field verification --
# nothing here launches an emulator, taps a UI element, or exercises any
# of the manual test hooks in DeveloperTestingActivity.

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Matches app/build.gradle's compileOptions (sourceCompatibility /
      # targetCompatibility VERSION_17).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No local.properties / GOOGLE_MAPS_API_KEY needed -- app/build.gradle
      # already defaults that BuildConfig field to an empty string when the
      # file (deliberately gitignored, never committed) is absent.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
